[package]
name = "prism-ui"
description = "Prism control interface: clip grid, layers, crossfader, clip properties, project files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
egui = "0.36.2"
prism-audio = { path = "../audio" }
prism-clock = { path = "../clock" }
prism-control = { path = "../control" }
prism-core = { path = "../core" }
prism-engine = { path = "../engine" }
prism-fx = { path = "../fx" }
rfd = "0.17.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
prism-render = { path = "../render" }
egui = "0.36.2"
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
tempfile.workspace = true

[lints]
workspace = true
