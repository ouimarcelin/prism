[package]
name = "prism-app"
description = "The Prism application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "prism"
path = "src/main.rs"

[features]
# NDI® input and output, off by default (ADR 0026):
# cargo run --release -p prism-app --features ndi
ndi = ["prism-engine/ndi", "prism-io-video/ndi"]

[dependencies]
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
png = "0.18.1"
pollster = "1.0.1"
prism-audio = { path = "../audio" }
prism-control = { path = "../control" }
prism-core = { path = "../core" }
prism-engine = { path = "../engine" }
prism-io-video = { path = "../io-video" }
prism-output = { path = "../output" }
prism-render = { path = "../render" }
prism-ui = { path = "../ui" }
winit = "0.30.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
midir = "0.11.1"

[[example]]
name = "midi-pad"
test = true
