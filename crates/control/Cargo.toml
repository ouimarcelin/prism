[package]
name = "prism-control"
description = "Control of Prism from outside: MIDI controllers, and the mappings from their messages to the composition."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "ws", "json", "tokio", "query"] }
midir = "0.11.1"
prism-clock = { path = "../clock" }
prism-core = { path = "../core" }
prism-dmx = { path = "../dmx" }
prism-fx = { path = "../fx" }
rosc = "0.11.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt", "net", "sync", "time"] }

[lints]
workspace = true
