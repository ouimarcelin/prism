[package]
name = "prism-engine"
description = "Prism playback engine: render thread, clip playback, decoding threads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# NDI® input and output (ADR 0026), through the NDI library the user
# installs. Off by default.
ndi = ["prism-io-video/ndi"]

[dependencies]
prism-audio = { path = "../audio" }
prism-clock = { path = "../clock" }
prism-core = { path = "../core" }
prism-fx = { path = "../fx" }
prism-media = { path = "../media" }
prism-render = { path = "../render" }

[target.'cfg(target_os = "macos")'.dependencies]
prism-io-video = { path = "../io-video" }
libc = "0.2"

[dev-dependencies]
png = "0.18.1"
prism-media = { path = "../media", features = ["test-support"] }
tempfile.workspace = true
# Object counts for engine-run (GPU buffers alive).
wgpu = { version = "30", features = ["counters"] }

[lints]
workspace = true
