[package]
name = "prism-io-video"
description = "Video shared with other applications: Syphon on macOS, NDI on the network (optional)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# NDI® input and output, through the NDI library installed by the user
# (loaded at run time, not distributed). Off by default: see ADR 0026.
ndi = ["dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }
prism-render = { path = "../render" }
wgpu = "30"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"

[lints]
workspace = true

[dev-dependencies]
prism-core = { path = "../core" }
