[package]
name = "prism-media"
description = "Media decoding for Prism: QuickTime container reading and HAP frame decoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Writers for HAP frames and QuickTime files, used by tests of this and other crates.
test-support = []

[dependencies]
png = "0.18.1"
snap = "1.1.2"
thiserror.workspace = true
zune-core = "0.5"
zune-jpeg = "0.5.15"

[dev-dependencies]
# Integration tests and examples use the test writers.
prism-media = { path = ".", features = ["test-support"] }
tempfile.workspace = true

[[example]]
name = "make-test-clip"
required-features = ["test-support"]

[lints]
workspace = true

# H.264 and ProRes through AVFoundation (ADR 0010).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSettings"] }
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
