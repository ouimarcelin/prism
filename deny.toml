# cargo-deny configuration. See docs/CLEAN_ROOM.md, section 6.
# Adding a license to the allow list requires an ADR in docs/decisions/.

[graph]
all-features = true
# Platforms Prism ships on (docs/SPEC.md): macOS first, Windows next.
# Linux-only dependencies are checked once Linux becomes a target.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
exceptions = [
    # Fonts embedded in the egui interface (Ubuntu Light, Noto Emoji): free
    # font licenses that allow bundling with software. See NOTICE, ADR 0008.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
