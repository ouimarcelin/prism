# cargo-deny configuration. See docs/CLEAN_ROOM.md, section 6.
# Adding a license to the allow list requires an ADR in docs/decisions/.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, no known vulnerability. Pulled by wgpu 26 through the
    # metal crate; remove once wgpu is upgraded (see ADR 0004).
    { id = "RUSTSEC-2024-0436", reason = "transitive via wgpu-hal/metal, unmaintained only" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
